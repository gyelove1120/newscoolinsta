<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스쿨 시사 어휘 사전</title>
<meta name="description" content="뉴스에 나오는 시사 어휘의 뜻을 초등학생 눈높이로 풀고, 교과서와 실제 뉴스쿨 기사로 이어 주는 시사 어휘 사전입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Do+Hyeon&display=swap">
<style>
/* 흰 바탕 단일 테마. 레이아웃: 사전 한 권. 표제어는 명조, 나머지는 뉴스쿨 고딕. 좁은 본문 칼럼 하나에 학년 색 띠로 교과를 구분 */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#15211b; --muted:#56675e; --faint:#8a9a91; --line:#e1e8e3;
  --accent:#00874a; --accent-2:#00b866; --accent-soft:#e6f5ec; --on-accent:#ffffff;
  --g3:#b45309; --g4:#0e7490; --g5:#4338ca; --g6:#be185d;
  --g3-soft:#fdf1e4; --g4-soft:#e3f4f7; --g5-soft:#ebeafc; --g6-soft:#fbe8f1;
  --mark:#fff1b8;
  --font:'IBM Plex Sans KR','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
  --display:'Do Hyeon','IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}


/* 머리 */
.mast{background:var(--bg);border-bottom:1px solid var(--line)}
.mast-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding-block:10px}
.cooley img{display:block;height:48px;width:auto}
.logo img{display:block;height:34px;width:auto}
.mast-title{font-size:20px;letter-spacing:-.01em;color:var(--ink);text-align:center;line-height:1.2;text-wrap:balance}
.mast.home .mast-in{padding-block:22px 18px}
.mast.home .cooley img{height:104px}
.mast.home .logo img{height:76px}
.mast.home .mast-title{font-size:clamp(24px,6.2vw,50px);word-break:keep-all}

.cooley,.mast-title,.logo{background:none;border:0;padding:0;cursor:pointer}
.mast .logo{justify-self:start}
.mast-title{font-family:var(--display);font-weight:400}
.hello{display:flex;align-items:center;gap:12px;margin-top:18px}
.hello img{height:76px;width:auto;flex-shrink:0}
.bubble{position:relative;margin:0;background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;width:14px;height:14px;background:var(--accent-soft);transform:translateY(-50%) rotate(45deg);border-radius:2px}
.bubble b{color:var(--accent);font-size:17px;font-variant-numeric:tabular-nums}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:21px}
.subsearch{padding-block:12px 0}
.subsearch .search input{height:42px;font-size:15px}
@media (max-width:520px){
  .mast.home .cooley img{height:66px}
  .mast.home .logo img{height:40px}
  .mast.home .mast-title{font-size:22px}
  .hello img{height:64px}
  .cooley img{height:40px}
  .logo img{height:28px}
  .mast-title{font-size:16px}
}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-weight:900;letter-spacing:.02em;color:var(--accent);font-size:15px}
.brand span{font-size:13px;color:var(--muted);font-weight:500}
.top-search{margin-left:auto;flex:0 1 260px;min-width:0}
.top-search[hidden]{display:none!important}

/* 검색창 */
.search{position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 44px 0 16px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--faint);pointer-events:none}
.top-search .search input{height:38px;font-size:14px;border-radius:10px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);overflow:hidden;z-index:30}
.suggest button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 14px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line)}
.suggest button:last-child{border-bottom:0}
.suggest button:hover,.suggest button.on{background:var(--accent-soft)}
.suggest strong{font-family:var(--display);font-weight:400;font-size:18px}
.suggest em{font-style:normal;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* 첫 화면 */
.hero{padding-block:24px 26px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin:0 0 10px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0 0 22px;color:var(--muted);font-size:15.5px}
.stats{display:flex;gap:18px;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

section{padding-block:22px;border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-h h2{font-size:17px;font-weight:900;margin:0;text-wrap:balance}
.sec-h small{font-size:12.5px;color:var(--faint);white-space:nowrap}

/* 이번 주 카드 */
.weekly{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 18px;cursor:pointer;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gc)}
.wcard:hover{border-color:var(--gc);transform:translateY(-1px)}
.wcard .lab{font-size:12px;font-weight:700;color:var(--gc)}
.wcard .unit{font-size:11.5px;color:var(--faint);line-height:1.4}
.wcard .w{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.2}
.wcard .d{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g3{--gc:var(--g3);--gs:var(--g3-soft)} .g4{--gc:var(--g4);--gs:var(--g4-soft)} .g5{--gc:var(--g5);--gs:var(--g5-soft)} .g6{--gc:var(--g6);--gs:var(--g6-soft)} .g0{--gc:var(--accent);--gs:var(--accent-soft)}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--accent)}
.chip .n{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:inherit;opacity:.7}
.chip.gsel.on{background:var(--gc);border-color:var(--gc);color:var(--on-accent)}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip-row::-webkit-scrollbar{display:none}
.browse-box{display:flex;flex-direction:column;gap:10px}
.browse-label{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em}

/* 초성 색인 */
.jamo{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.jamo button{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.jamo button b{font-family:var(--display);font-weight:400;font-size:20px}
.jamo button small{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.jamo button:hover{border-color:var(--accent)}
.jamo button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.jamo button.on small{color:inherit}
.jamo button:disabled{opacity:.35;cursor:default}

/* 어휘 목록 */
.wlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.wlist li{border-bottom:1px solid var(--line)}
.wlist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer}
.wlist button:hover .hw{color:var(--accent)}
.wlist .hw{font-family:var(--display);font-weight:400;font-size:19px}
.wlist .meta{font-size:12px;color:var(--faint);align-self:center;white-space:nowrap}
.wlist .def{grid-column:1/-1;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{display:block;margin:14px auto 0;min-height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}

/* 어휘 상세 */
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--faint);padding-top:18px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.from{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--gs);color:var(--gc);font-size:13.5px;font-weight:700}
.entry{padding-block:22px 6px}
.entry-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.entry h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,9vw,52px);line-height:1.15;margin:0}
.field{font-size:13px;color:var(--muted);font-weight:500}
.aliases{font-size:13px;color:var(--faint);margin-top:6px}
.block{padding-block:20px;border-top:1px solid var(--line)}
.block h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin:0 0 12px}
.block h2 .no{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);font-size:11px}
.def-big{font-size:clamp(18px,4.4vw,21px);line-height:1.65;font-weight:500;margin:0;max-width:34em;text-wrap:pretty}
.curr{display:flex;flex-direction:column;gap:8px}
.curr-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--gs);min-width:0}
.curr-item .gb{font-weight:900;color:var(--gc);font-size:14px;white-space:nowrap}
.curr-item .ut{font-size:13.5px;color:var(--ink);min-width:0}
.curr-item.hl{outline:2px solid var(--gc)}
.note{font-size:12.5px;color:var(--faint);margin:10px 0 0}

/* 기사 카드 */
.news{display:flex;flex-direction:column;gap:10px}
.ncard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;transition:border-color .15s}
.ncard:hover{border-color:var(--accent)}
.ncard .k{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ncard .k .kind{color:var(--accent);font-weight:700}
.ncard .t{grid-column:1;font-weight:700;font-size:15.5px;line-height:1.45;text-wrap:pretty}
.ncard .tags{grid-column:1;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--gs,var(--accent-soft));color:var(--gc,var(--accent));font-weight:700;white-space:nowrap}
.tag.plain{background:var(--bg);color:var(--muted);font-weight:500;border:1px solid var(--line)}
.ncard .go{grid-column:2;grid-row:1/span 3;font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.ncard.nolink{cursor:default}
.ncard.nolink .go{color:var(--faint);font-weight:500}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* 뉴스 목록 */
.yr{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;display:flex;gap:10px;align-items:center}
.yr::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{padding:28px 0;color:var(--muted);font-size:14px}

footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px 40px;font-size:12px;color:var(--faint)}
footer .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.live{background:var(--accent-2)}

@media (max-width:520px){
  .top-in{gap:8px}
  .brand span{display:none}
  .hero{padding-block:28px 22px}
  .ncard{grid-template-columns:minmax(0,1fr)}
  .ncard .go{grid-column:1;grid-row:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
const keyOf=h=>String(h||'').replace(/\s+/g,'').trim();
function toObjects(rows){
  if(!rows||!rows.length)return[];
  const H=rows[0].map(keyOf);
  return rows.slice(1).map(r=>{const o={};H.forEach((h,i)=>{if(h)o[h]=String(r[i]??'').trim();});return o;});
}

const MERGE={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};

function choOf(w){const c=w.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const j=CHO[Math.floor((c-0xAC00)/588)];return MERGE[j]||j;}return 'A·1';}
const gradeNum=s=>{const m=String(s||'').match(/([1-6])/);return m?+m[1]:0;};

function parseCurriculum(s){
  return splitList(String(s||'').replace(/\|/g,' ')).map(line=>{
    const grade=gradeNum((line.match(/[1-6]\s*학년/)||[''])[0]);
    const subject=SUBJECTS.find(x=>line.includes(x))||'';
    let rest=line.replace(/[1-6]\s*학년/,'').replace(subject,'').replace(/\s+/g,' ').trim();
    return {grade,subject,unit:rest,raw:line};
  }).filter(c=>c.grade||c.subject);
}

  if((m=d.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  if((m=d.match(/^(\d{2})-(\d{1,2})-(\d{1,2})$/)))return '20'+m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return d;
}

let DB={words:[],articles:[],weekly:[],byNorm:new Map()};

function build(raw){
  const articles=toObjects(raw.articles).filter(a=>a['제목']).map(a=>{
    const url=a['URL']||a['url']||'';
    const slug=url.replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,'');
    const vol=String(a['호수']||'').replace(/\D/g,'');
    return {vol,slug,kind:a['종류']||'이번 주 뉴스쿨',title:a['제목'],date:normDate(a['발행일']),url,
      cat:splitList(a['분야']),kw:splitList(a['키워드']),kwN:splitList(a['키워드']).map(norm),
      subject:splitList(a['교과']),grade:gradeNum(a['학년']),unit:a['단원']||'',titleN:norm(a['제목'])};
  }).sort((a,b)=>b.date.localeCompare(a.date));
  const byRef=new Map();articles.forEach(a=>{if(a.vol)byRef.set(a.vol,a);if(a.slug)byRef.set(a.slug,a);});

  const words=toObjects(raw.words).filter(w=>w['어휘']&&w['뜻']&&(w['상태']||'공개')!=='숨김').map(w=>({
    word:w['어휘'],def:w['뜻'],curriculum:parseCurriculum(w['교과연계']),field:w['분야']||'',
    related:splitList(w['연관어']),aliases:splitList(w['다른표기']),
    keys:[w['어휘'],...splitList(w['다른표기']),...splitList(w['기사검색어'])],
    include:parseRefs(w['고정기사']),exclude:parseRefs(w['제외기사'])
  }));
  const byNorm=new Map();
  words.forEach(w=>{[w.word,...w.aliases].forEach(k=>{const n=norm(k);if(n&&!byNorm.has(n))byNorm.set(n,w);});});

  // 어휘 ↔ 기사 연결
  words.forEach(w=>{
    const keys=[...new Set(w.keys.map(norm).filter(Boolean))];
    const ex=new Set(w.exclude.map(r=>byRef.get(r)).filter(Boolean));
    const scored=new Map();
    const fixed=w.include.map(r=>byRef.get(r)).filter(Boolean);
    articles.forEach(a=>{
      if(ex.has(a))return;
      let s=0;
      keys.forEach(k=>{ if(a.kwN.includes(k))s=Math.max(s,3); else if(k.length>=2&&a.titleN.includes(k))s=Math.max(s,2); else if(k.length>=3&&a.kwN.some(x=>x.includes(k)))s=Math.max(s,1); });
      if(s)scored.set(a,s);
    });
    fixed.forEach(a=>scored.set(a,9));
    w.news=[...scored.entries()].sort((x,y)=>y[1]-x[1]||y[0].date.localeCompare(x[0].date)).map(e=>e[0]);
    // 교과: 직접 입력한 것 우선, 없으면 관련 기사에서 모음
    if(w.curriculum.length){w.currSource='direct';}
    else{
      const cnt=new Map();
      w.news.forEach(a=>{if(a.grade&&a.subject.length){a.subject.forEach(s=>{const k=a.grade+'|'+s+'|'+a.unit;cnt.set(k,(cnt.get(k)||0)+1);});}});
      w.curriculum=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>{const[g,s,u]=k.split('|');return{grade:+g,subject:s,unit:u};});
      w.currSource=w.curriculum.length?'news':'none';
    }
  });
  // 연관어: 입력한 것 우선, 없으면 같은 기사에 함께 나온 말
  words.forEach(w=>{
    let rel=w.related.map(r=>({label:r,target:byNorm.get(norm(r))||null}));
    if(!rel.length&&w.news.length){
      const set=new Set(w.news);const cnt=new Map();
      words.forEach(o=>{if(o===w)return;const c=o.news.filter(a=>set.has(a)).length;if(c)cnt.set(o,c);});
      rel=[...cnt.entries()].sort((a,b)=>b[1]-a[1]||b[0].news.length-a[0].news.length).slice(0,5).map(([o])=>({label:o.word,target:o}));
    }
    w.rel=rel;
  });
  const wk=toObjects(raw.weekly).filter(r=>r['어휘']).map(r=>({date:normDate(r['발행일']),grade:gradeNum(r['학년']),subject:r['교과']||'',unit:r['단원']||'',word:r['어휘']}));
  const last=wk.map(r=>r.date).sort().pop();
  DB={words,articles,weekly:wk.filter(r=>r.date===last).sort((a,b)=>a.grade-b.grade),weeklyDate:last,byNorm};
}

async function fetchText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.text();}
async function load(){
  const src=document.getElementById('srcInfo');
  const tryRemote=async()=>{
    const out={};
    for(const k of ['words','articles','weekly']){
      let url=CONFIG.CSV_URLS[k];
      if(!url&&CONFIG.SHEET_ID)url='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(CONFIG.SHEET_NAMES[k]);
      if(!url)return null;
      out[k]=parseCSV(await fetchText(url));
    }
    return out;
  };
  let raw=null;
  try{raw=await tryRemote();}catch(e){console.warn('시트/CSV 읽기 실패, 저장된 데이터 사용',e);}
  if(raw&&raw.words.length>1){build(raw);src.innerHTML='<span class="dot live"></span>시트에서 실시간으로 불러옴 · 어휘 '+DB.words.length+'개';}
  else{build(EMBED);src.innerHTML='<span class="dot"></span>저장된 데이터 사용 중 · 어휘 '+DB.words.length+'개';}
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text,q){if(!q)return esc(text);const i=String(text).toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));}
const gcls=g=>g>=3&&g<=6?'g'+g:'g0';
const fmtDate=d=>d?d.replace(/-/g,'.'):'';
function setMeta(title,desc){
  document.title=title;
  let m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',desc);
}
function setJsonLd(obj){
  let s=document.getElementById('ld');
  if(!obj){if(s)s.remove();return;}
  if(!s){s=document.createElement('script');s.type='application/ld+json';s.id='ld';document.head.appendChild(s);}
  s.textContent=JSON.stringify(obj);
}

function readState(){
  let p;try{p=new URLSearchParams(location.search);}catch(e){p=new URLSearchParams();}
  const subj=p.get('subject')||'';
  return {word:p.get('word')||'',grade:gradeNum(p.get('grade')),subject:SUBJ_CODE[subj.toLowerCase()]||subj,
    view:p.get('view')||'',q:p.get('q')||'',jamo:p.get('jamo')||'',g:gradeNum(p.get('g')),s:p.get('s')||''};
}
function go(state,replace){
  const p=new URLSearchParams();
  Object.entries(state).forEach(([k,v])=>{if(v)p.set(k,v);});
  // UTM 등 들어온 값은 보존
  try{new URLSearchParams(location.search).forEach((v,k)=>{if(k.startsWith('utm_'))p.set(k,v);});}catch(e){}
  const url=location.pathname+(p.toString()?'?'+p:'');
  try{history[replace?'replaceState':'pushState'](state,'',url);}catch(e){}
  render(state);window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>render(readState()));

/* ---------- 검색 ---------- */
function searchWords(q){
  const n=norm(q);if(!n)return[];
  const res=[];
  DB.words.forEach(w=>{
    const wn=norm(w.word);let s=0;
    if(wn===n||w.aliases.some(a=>norm(a)===n))s=100;
    else if(wn.startsWith(n))s=60;
    else if(wn.includes(n)||w.aliases.some(a=>norm(a).includes(n)))s=40;
    else if(n.length>=2&&norm(w.def).includes(n))s=10;
    if(s)res.push([w,s+Math.min(w.news.length,9)]);
  });
  return res.sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function searchNews(q){const n=norm(q);if(!n)return[];return DB.articles.filter(a=>a.titleN.includes(n)||a.kwN.some(k=>k.includes(n))||(a.vol&&a.vol===q.replace(/\D/g,'')));}

function bindSearch(input,box){
  let idx=-1,items=[];
  const close=()=>{box.hidden=true;idx=-1;};
  input.addEventListener('input',()=>{
    const q=input.value.trim();items=searchWords(q).slice(0,6);idx=-1;
    if(!q||!items.length){close();return;}
    box.innerHTML=items.map((w,i)=>'<button type="button" data-i="'+i+'"><strong>'+hl(w.word,q)+'</strong><em>'+esc(w.def)+'</em></button>').join('');
    box.hidden=false;
  });
  box.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();input.value='';close();openWord(items[+b.dataset.i]);}});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&items.length){idx=Math.min(idx+1,items.length-1);e.preventDefault();}
    else if(e.key==='ArrowUp'&&items.length){idx=Math.max(idx-1,0);e.preventDefault();}
    else if(e.key==='Enter'){
      e.preventDefault();const q=input.value.trim();if(!q)return;
      const pick=idx>=0?items[idx]:(items[0]&&norm(items[0].word)===norm(q)?items[0]:null);
      close();input.blur();
      if(pick){input.value='';openWord(pick);}else go({view:'search',q});
      return;
    }else if(e.key==='Escape'){close();return;}
    [...box.children].forEach((b,i)=>b.classList.toggle('on',i===idx));
  });
  input.addEventListener('blur',()=>setTimeout(close,120));
}
const openWord=w=>go({word:w.word});

    +a.cat.slice(0,2).map(c=>'<span class="tag plain">'+esc(c)+'</span>').join('');
  const head='<span class="k"><span class="kind">'+(a.vol?'이번 주 뉴스쿨':esc(a.kind))+'</span>'+(a.vol?'<span>'+kind+'</span>':'')+'<span>'+fmtDate(a.date)+'</span></span>'
    +'<span class="t">'+hl(a.title,q)+'</span>'+(tags?'<span class="tags">'+tags+'</span>':'');
  if(!a.url)return '<div class="ncard nolink">'+head+'<span class="go">링크 준비 중</span></div>';

}

   +'<section><div class="sec-h"><h2>학년·교과로 둘러보기</h2></div><div class="browse-box"><span class="browse-label">학년</span><div class="chip-row">'
     +[3,4,5,6].map(g=>'<button class="chip gsel g'+g+'" type="button" data-bg="'+g+'">'+g+'학년</button>').join('')+'</div></div></section>'
   +'<section><div class="sec-h"><h2>ㄱㄴㄷ으로 찾기</h2><small>전체 '+DB.words.length+'개</small></div><div class="jamo">'
     +JAMO.map(j=>'<button type="button" data-j="'+j+'" '+(counts[j]?'':'disabled')+'><b>'+(j==='A·1'?'A·1':j)+'</b><small>'+(counts[j]||0)+'</small></button>').join('')+'</div></section>'
   +'<section><div class="sec-h"><h2>지난 뉴스 전체 보기</h2></div><button class="more" style="margin:0" type="button" id="allNews">뉴스쿨 기사 '+DB.articles.length+'개 목록 →</button></section>';
  bindSearch($('#q1'),$('#q1s'));
  bindWordButtons($('#app'));
  $('#app').querySelectorAll('[data-wk]').forEach(b=>b.addEventListener('click',()=>go({word:b.dataset.wk,grade:b.dataset.g,subject:b.dataset.s})));
  $('#app').querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>go({view:'browse',g:b.dataset.bg})));
  $('#app').querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>go({view:'jamo',jamo:b.dataset.j})));
  $('#allNews').addEventListener('click',()=>go({view:'news'}));
}

/* ---------- 어휘 상세 ---------- */
function renderWord(st){
  const w=DB.byNorm.get(norm(st.word));
  if(!w){$('#app').innerHTML=crumb([])+'<div class="entry"><h1 style="font-size:28px">\''+esc(st.word)+'\'은(는) 아직 사전에 없어요</h1></div><p class="empty">대신 뉴스에서 찾아볼까요? <button class="more" style="display:inline-block;margin:0 0 0 6px" id="toSearch" type="button">\''+esc(st.word)+'\' 뉴스 검색</button></p>';bindCrumb();$('#toSearch').addEventListener('click',()=>go({view:'search',q:st.word}));return;}
  setMeta(w.word+' 뜻 - '+CONFIG.SITE_NAME, w.word+': '+w.def+' 초등 교과 연계와 관련 뉴스쿨 기사 '+w.news.length+'개를 함께 볼 수 있어요.');
  setJsonLd({'@context':'https://schema.org','@type':'DefinedTerm',name:w.word,description:w.def,inDefinedTermSet:{'@type':'DefinedTermSet',name:CONFIG.SITE_NAME}});
  const from=st.grade&&st.subject?'<div class="from '+gcls(st.grade)+'">'+st.grade+'학년 '+esc(st.subject)+' 교과서에서 온 낱말이에요</div>':'';
  const curr=w.curriculum.length?'<div class="curr">'+w.curriculum.map(c=>{const on=st.grade&&c.grade===st.grade&&(!st.subject||c.subject===st.subject);return '<div class="curr-item '+gcls(c.grade)+(on?' hl':'')+'"><span class="gb">'+(c.grade?c.grade+'학년 ':'')+esc(c.subject)+'</span><span class="ut">'+esc(c.unit)+'</span></div>';}).join('')+'</div>'
    +(w.currSource==='news'?'<p class="note">이 말이 나온 뉴스쿨 기사의 교과 연계를 모아 보여 줘요.</p>':'')
    :'<p class="note" style="margin:0">아직 연결된 교과가 없어요.</p>';
  const rel=w.rel.length?'<div class="chips">'+w.rel.map(r=>r.target?'<button class="chip" type="button" data-word="'+esc(r.target.word)+'">'+esc(r.label)+'</button>':'<span class="chip" style="cursor:default;opacity:.7">'+esc(r.label)+'</span>').join('')+'</div>':'<p class="note" style="margin:0">함께 볼 말을 준비하고 있어요.</p>';
  const N=w.news.length,first=3;
  const news=N?'<div class="news" id="newsList">'+w.news.slice(0,first).map(a=>newsCard(a,'')).join('')+'</div>'+(N>first?'<button class="more" type="button" id="moreNews">관련 뉴스 '+(N-first)+'개 더 보기</button>':''):'<p class="note" style="margin:0">아직 연결된 뉴스가 없어요.</p>';
  $('#app').innerHTML=crumb([[w.field||'어휘',null]])+from
   +'<div class="entry"><div class="entry-top"><h1>'+esc(w.word)+'</h1>'+(w.field?'<span class="field">「'+esc(w.field)+'」</span>':'')+'</div>'+(w.aliases.length?'<div class="aliases">같은 말 · '+esc(w.aliases.join(', '))+'</div>':'')+'</div>'
   +'<div class="block"><h2><span class="no">1</span>무슨 뜻일까요?</h2><p class="def-big">'+esc(w.def)+'</p></div>'
   +'<div class="block"><h2><span class="no">2</span>교과서에서는</h2>'+curr+'</div>'
   +'<div class="block"><h2><span class="no">3</span>뉴스에서는 어떻게 쓰일까요?'+(N?' <span style="color:var(--faint);font-weight:500;letter-spacing:0">· '+N+'개</span>':'')+'</h2>'+news+'</div>'
   +'<div class="block"><h2><span class="no">4</span>함께 알아두면 좋은 말</h2>'+rel+'</div>';
  bindCrumb();bindWordButtons($('#app'));
  const mb=$('#moreNews');if(mb)mb.addEventListener('click',()=>{$('#newsList').innerHTML=w.news.map(a=>newsCard(a,'')).join('');mb.remove();});
}
function crumb(parts){return '<nav class="crumb"><button type="button" data-home>시사 어휘 사전</button>'+parts.map(p=>'<span>›</span><span>'+esc(p[0])+'</span>').join('')+'</nav>';}
function bindCrumb(){$('#app').querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>go({})));}

/* ---------- 학년·교과 ---------- */
function renderBrowse(st){
  const g=st.g||3;
  const subjects=SUBJECTS.filter(s=>DB.words.some(w=>w.curriculum.some(c=>c.grade===g&&c.subject===s)));
  const s=subjects.includes(st.s)?st.s:'';
  const list=DB.words.filter(w=>w.curriculum.some(c=>c.grade===g&&(!s||c.subject===s)))
    .sort((a,b)=>(b.currSource==='direct')-(a.currSource==='direct')||b.news.length-a.news.length);
  setMeta(g+'학년'+(s?' '+s:'')+' 시사 어휘 - '+CONFIG.SITE_NAME,g+'학년'+(s?' '+s:'')+' 교과와 연결되는 시사 어휘 '+list.length+'개');setJsonLd(null);
  $('#app').innerHTML=crumb([['학년·교과로 둘러보기',null]])
   +'<div class="entry"><h1 style="font-size:30px">'+g+'학년'+(s?' '+esc(s):'')+' 시사 어휘</h1></div>'
   +'<div class="browse-box" style="margin-bottom:18px"><span class="browse-label">학년</span><div class="chip-row">'+[3,4,5,6].map(x=>'<button class="chip gsel g'+x+(x===g?' on':'')+'" type="button" data-g="'+x+'">'+x+'학년</button>').join('')+'</div>'
   +'<span class="browse-label">교과</span><div class="chip-row"><button class="chip'+(s?'':' on')+'" type="button" data-s="">전체</button>'+subjects.map(x=>'<button class="chip'+(x===s?' on':'')+'" type="button" data-s="'+x+'">'+x+'</button>').join('')+'</div></div>'
   +(list.length?wordList(list,40,'browse'):'<p class="empty">이 학년·교과와 연결된 어휘가 아직 없어요.</p>');
  bindCrumb();bindWordButtons($('#app'));
  $('#app').querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>go({view:'browse',g:b.dataset.g},true)));
  $('#app').querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>go({view:'browse',g:String(g),s:b.dataset.s},true)));
  const m=$('[data-more="browse"]');if(m)m.addEventListener('click',()=>{m.previousElementSibling.outerHTML=wordList(list,9999,'x');m.remove();bindWordButtons($('#app'));});
}

/* ---------- 초성 ---------- */
function renderJamo(st){
  const j=JAMO.includes(st.jamo)?st.jamo:'ㄱ';
  const list=DB.words.filter(w=>choOf(w.word)===j).sort((a,b)=>a.word.localeCompare(b.word,'ko'));
  setMeta(j+'으로 시작하는 시사 어휘 - '+CONFIG.SITE_NAME,j+'으로 시작하는 시사 어휘 '+list.length+'개');setJsonLd(null);
  $('#app').innerHTML=crumb([['ㄱㄴㄷ으로 찾기',null]])
   +'<div class="entry"><h1 style="font-size:30px">'+(j==='A·1'?'영문·숫자':j)+'</h1></div>'
   +'<div class="jamo" style="margin-bottom:18px">'+JAMO.map(x=>'<button type="button" data-j="'+x+'" class="'+(x===j?'on':'')+'"><b>'+x+'</b></button>').join('')+'</div>'
   +wordList(list,9999,'j');
  bindCrumb();bindWordButtons($('#app'));
  $('#app').querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>go({view:'jamo',jamo:b.dataset.j},true)));
}

/* ---------- 검색 결과 ---------- */
function renderSearch(st){
  const q=st.q;const ws=searchWords(q);const ns=searchNews(q);
  setMeta('\''+q+'\' 검색 - '+CONFIG.SITE_NAME,'\''+q+'\' 시사 어휘와 관련 뉴스');setJsonLd(null);
  $('#app').innerHTML=crumb([['검색',null]])
   +'<div class="entry"><h1 style="font-size:28px">\''+esc(q)+'\' 검색 결과</h1></div>'
   +'<div class="block"><h2>어휘 · '+ws.length+'개</h2>'+(ws.length?wordList(ws,10,'sw'):'<p class="note" style="margin:0">일치하는 어휘가 없어요.</p>')+'</div>'
   +'<div class="block"><h2>뉴스 · '+ns.length+'개</h2>'+(ns.length?'<div class="news">'+ns.slice(0,30).map(a=>newsCard(a,q)).join('')+'</div>':'<p class="note" style="margin:0">일치하는 뉴스가 없어요.</p>')+'</div>';
  bindCrumb();bindWordButtons($('#app'));
  const m=$('[data-more="sw"]');if(m)m.addEventListener('click',()=>{m.previousElementSibling.outerHTML=wordList(ws,9999,'x');m.remove();bindWordButtons($('#app'));});
}

/* ---------- 뉴스 목록 ---------- */
function renderNews(st){
  setMeta('뉴스쿨 기사 목록 - '+CONFIG.SITE_NAME,'뉴스쿨이 발행한 기사 전체 목록');setJsonLd(null);
  const q=st.q||'';
  const list=q?searchNews(q):DB.articles;
  const groups={};list.forEach(a=>{const y=a.date.slice(0,4)||'기타';(groups[y]=groups[y]||[]).push(a);});
  $('#app').innerHTML=crumb([['뉴스쿨 기사 목록',null]])
   +'<div class="entry"><h1 style="font-size:30px">뉴스쿨 기사 목록</h1></div>'
   +'<div class="search" style="margin-bottom:8px"><input id="nq" type="search" placeholder="기사 제목·키워드·호수로 찾기" value="'+esc(q)+'" aria-label="기사 검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>'
   +'<p class="note" style="margin:0 0 6px">'+list.length+'개</p>'
   +Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(y=>'<div class="yr">'+y+'</div><div class="news">'+groups[y].map(a=>newsCard(a,q)).join('')+'</div>').join('');
  bindCrumb();
  let t;$('#nq').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{go({view:'news',q:e.target.value.trim()},true);const i=$('#nq');i.focus();i.setSelectionRange(i.value.length,i.value.length);},350);});
}

/* ---------- 라우터 ---------- */
function render(st){
  const isHome=!st.word&&!st.view;
  $('#topSearch').hidden=isHome;$('#mast').classList.toggle('home',isHome);
  if(st.word)renderWord(st);
  else if(st.view==='browse')renderBrowse(st);
  else if(st.view==='jamo')renderJamo(st);
  else if(st.view==='search'&&st.q)renderSearch(st);
  else if(st.view==='news')renderNews(st);
  else renderHome(st);
}
$('#homeBtn').addEventListener('click',()=>go({}));$('#homeBtn2').addEventListener('click',()=>go({}));
bindSearch($('#q2'),$('#sug2'));
load().then(()=>render(readState()));
</script>

</body>
</html>
